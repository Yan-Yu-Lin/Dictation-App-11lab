[project]
name = "dictation-app"
version = "0.1.0"
description = "Real-time dictation app using ElevenLabs Scribe v2 Realtime API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "elevenlabs>=2.23.0",
    "funasr>=1.3.1",
    "opencc>=1.1.9",
    "pyaudio>=0.2.14",
    "pynput>=1.8.1",
    "pyobjc-core>=12.1",
    "pyobjc-framework-cocoa>=12.1",
    "pyobjc-framework-quartz>=12.1",
    "pyperclip>=1.11.0",
    "python-dotenv>=1.2.1",
    "quickmachotkey>=2025.7.28",
    "torch>=2.10.0",
    "torchaudio>=2.10.0",
]
